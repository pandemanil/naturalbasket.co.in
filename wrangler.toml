# Cloudflare PAGES project (static Vite build in dist/ + Pages Functions in functions/).
# Deploys run from Git via the Pages dashboard (no deploy command). Do NOT create this as a Worker.
name = "natural-basket"
compatibility_date = "2024-10-22"
pages_build_output_dir = "dist"

# D1 database. Replace database_id after `wrangler d1 create natural-basket-db`.
[[d1_databases]]
binding = "DB"
database_name = "natural-basket-db"
database_id = "REPLACE_WITH_D1_DATABASE_ID"
migrations_dir = "migrations"

# R2 bucket for product images. Create with `wrangler r2 bucket create natural-basket-images`.
[[r2_buckets]]
binding = "IMAGES"
bucket_name = "natural-basket-images"

# For Pages, the dashboard values (Settings > Environment variables) are authoritative.
[vars]
WHATSAPP_NUMBER = "917993251579"
